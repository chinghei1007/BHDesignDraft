<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Playground tutorial</title><style>body{font:16px/1.55 system-ui,sans-serif;color:#203b30;background:#f3f6f3;margin:0}main{max-width:760px;margin:auto;padding:32px 20px}section{background:white;padding:24px;border:1px solid #dce7df;border-radius:16px}button,a{font:inherit}button{padding:10px 15px;border:1px solid #557a65;background:#28533f;color:white;border-radius:8px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;margin-top:24px}a{color:#195d3a}progress{width:100%}:focus-visible{outline:3px solid #399868;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Open the playground</a></p><h1>Design playground tutorial</h1><p>Use the steps below as you explore the playground in another tab.</p><progress id="progress" max="5" value="1" aria-label="Tutorial progress"></progress><section aria-live="polite"><p id="count"></p><h2 id="title"></h2><p id="description"></p><div class="actions"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div></section><p><a href="README.md">Read the full README</a></p></main><script>const steps=[['Choose a design','Open the playground and use the layout selector or arrows. Choose a palette, then adjust its colors below the preview.'],['Adjust the layout','Use Layout settings to change typography, container spacing, radius, and shadows. Choose all sides, horizontal, vertical, or individual sides for spacing.'],['Explore components','Adjust buttons and navigation, try the sidebar icon toggle, and use the sample lists and optional table to preview their styles.'],['Finish the footer','The footer starts with a copyright line. Turn on additional footer information for a larger example; its icon is not a link.'],['Export the stylesheet','Click Download App.css. For a color-free export, enable Disable color scheme first. Merge the resulting CSS into a Tailwind v4 project and adapt its selectors to your application.']];let index=0;const title=document.querySelector('#title'),description=document.querySelector('#description'),count=document.querySelector('#count'),progress=document.querySelector('#progress'),previous=document.querySelector('#previous'),next=document.querySelector('#next');function render(){title.textContent=steps[index][0];description.textContent=steps[index][1];count.textContent='Step '+(index+1)+' of '+steps.length;progress.value=index+1;previous.disabled=index===0;next.disabled=index===steps.length-1}previous.addEventListener('click',()=>{index--;render()});next.addEventListener('click',()=>{index++;render()});render();</script></body></html>
